<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Офлайн — Архитектор Капитала PRO</title>
<style>
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #030806;
    color: #d8ffe6;
    font-family: "Cascadia Mono", "JetBrains Mono", "Consolas", "Courier New", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .wrap { max-width: 480px; padding: 32px; }
  h1 { color: #00ff66; font-size: 24px; margin-bottom: 12px; text-shadow: 0 0 12px rgba(0,255,102,.35); }
  p { color: #7fa98d; font-size: 13px; line-height: 1.6; margin-bottom: 24px; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 36px;
    padding: 8px 18px;
    border: 1px solid #00ff66;
    background: #00ff66;
    color: #021008;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 2px;
    cursor: pointer;
    transition: 0.18s ease;
  }
  .btn:hover { background: transparent; color: #00ff66; box-shadow: 0 0 20px rgba(0,255,102,.4); }
  .btn:active { transform: translateY(1px); }
  .status { margin-top: 20px; font-size: 10px; color: #4d725a; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ОФЛАЙН</h1>
  <p>Вы сейчас без подключения к интернету. Приложение Kapital-Architect PRO работает локально — ваши данные сохранены в браузере.</p>
  <button class="btn" onclick="location.reload()">ОБНОВИТЬ СТРАНИЦУ</button>
  <div class="status">Капитал Архитектора PRO · Локальный режим</div>
</div>
</body>
</html>
